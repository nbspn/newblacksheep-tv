<!DOCTYPE html>
<!--
=============================================================================
 TV SLIDESHOW — index.html (GitHub Pages display page)
=============================================================================
 WHAT IT DOES
   Full-screen slideshow for smart TVs and phones. Shows every image in the
   Google Drive slideshow folder. No Google banner, and no "unable to open
   the file" error for people signed in to several Google accounts.

 HOW IT WORKS
   - This page holds NO images and NO settings. Everything comes from the
     Apps Script data feed (Code.gs v1.2.0+):
       FEED_URL?api=list         → settings + list of slides
       FEED_URL?api=image&id=ID  → one image
   - Change slides in the Drive folder; change settings in CONFIG in Code.gs
     (then Deploy → Manage deployments → New version). This page picks both
     up at its next check (REFRESH_MINUTES, default 5) — no edits here.
   - Requests are made without anyone's Google sign-in, which is what avoids
     the multi-account error.
   - Random order (if SHUFFLE on), never the same slide twice in a row;
     crossfade; images cached so each downloads once; keeps playing cached
     slides if Wi-Fi drops; full page reload every RELOAD_HOURS.

 SETUP (one time)
   1. Put this file in a public GitHub repository named e.g. blacksheep-tv,
      as index.html.
   2. Settings → Pages → Branch: main, /(root) → Save.
   3. Page address: https://YOUR-USERNAME.github.io/blacksheep-tv/
   SCROLLING MESSAGE (v1.4.0): when the feed sends messages (from the
   "TV Scrolling Message" Google Doc), a navy bar scrolls them across the
   bottom and the slides shrink to fit above it. No messages = no bar.

   The only thing that would ever require editing this file is FEED_URL —
   and only if a brand-new Apps Script deployment is created (always use
   "New version" on the existing deployment instead).

=============================================================================
 CHANGELOG
=============================================================================
   v1.2.0  2026-11-19  BASELINE CHECKPOINT. Standalone display page fed by
                        the Apps Script JSON feed; replaces tv.html (iframe
                        wrapper). Same playback behavior as Index.html
                        v1.1.0; settings now applied live from the feed.
   v1.4.0  2026-11-21  Scrolling message bar (navy, white text, orange ★
                        between messages) fed by "ticker" from the feed;
                        slides shrink above it while it shows; speed from
                        tickerSpeed. Built on v1.2.0 (v1.3.0 key not used).
   v1.4.1  2026-11-21  Black border around each slide (marginPct from the
                        feed, default 4% of screen height) so images never
                        touch the screen edges or the scrolling bar.
   v1.4.2  2026-11-21  N.E.W. Black Sheep ram logo at the start of each
                        message run in the scrolling bar, sized to fit the
                        bar (built into this file as TICKER_LOGO).
   v1.4.3  2026-11-21  Slides with "_long" in the file name stay up
                        longSlideMs (from the feed) instead of slideMs.
=============================================================================

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Sheep TV</title>
<style>
  /* v1.2.0 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    object-fit: contain; opacity: 0; transition-property: opacity; transition-timing-function: ease-in-out;
  }
  .slide.show { opacity: 1; }
  /* v1.4.0 — scrolling message bar; slides shrink above it while it shows */
  body.has-ticker .slide { height: 90vh; }
  /* v1.4.1 — border so slides never touch the edges (or the ticker bar) */
  :root { --m: 4vh; }
  .slide { top: var(--m); left: var(--m); width: calc(100vw - 2 * var(--m)); height: calc(100vh - 2 * var(--m)); }
  body.has-ticker .slide { height: calc(90vh - 2 * var(--m)); }
  #ticker {
    position: absolute; left: 0; bottom: 0; width: 100vw; height: 10vh;
    background: #1F4E78; overflow: hidden; display: none;
  }
  body.has-ticker #ticker { display: block; }
  #tickerText {
    position: absolute; top: 0; left: 0; height: 10vh; line-height: 10vh;
    white-space: nowrap; color: #fff; font: bold 5.5vh/10vh Arial, sans-serif;
    will-change: transform;
  }
  #tickerText .sep { color: #FF6600; padding: 0 1.2em; }
  /* v1.4.2 — logo at the start of each run, fits inside the bar */
  #tickerText .logo { height: 8vh; width: calc(8vh * 165 / 172);  /* fixed size so the scroll loop measures correctly before the image decodes */ vertical-align: middle; margin: 0 0.9em 0 0; position: relative; top: -0.3vh; }
  #msg {
    position: absolute; top: 50%; left: 0; width: 100%; transform: translateY(-50%);
    color: #888; font: 32px/1.4 Arial, sans-serif; text-align: center; display: none;
  }
</style>
</head>

  <div id="msg"></div>
  <div id="ticker"><div id="tickerText"></div></div>  <!-- v1.4.0 -->

      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || 'Bad response');
      return j;
    });
    var timeout = new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error('timeout')); }, 30000);
    });
    return Promise.race([req, timeout]);
  }

  // v1.4.0 — Scrolling message bar
  var tickerKey = '';      // messages currently shown (to detect changes)
  var tickerX = 0;         // current scroll offset in px
  var tickerCopyW = 0;     // width of one copy of the message run
  var tickerLast = 0;      // last animation timestamp
  var tickerEl = document.getElementById('tickerText');
  function escapeHtml(t) {
    return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function setTicker(messages) {
    messages = messages || [];
    var key = messages.join('\n');
    if (key === tickerKey) return;
    tickerKey = key;
    if (!messages.length) { document.body.classList.remove('has-ticker'); tickerEl.innerHTML = ''; return; }
    document.body.classList.add('has-ticker');
    var sep = '<span class="sep">★</span>';
    var run = '<img class="logo" src="' + TICKER_LOGO + '" alt="">' + messages.map(escapeHtml).join(sep) + sep;  // v1.4.2 — logo first
    // one copy to measure, then repeat enough copies to cover the screen twice
    tickerEl.innerHTML = '<span>' + run + '</span>';
    tickerCopyW = tickerEl.firstChild.getBoundingClientRect().width || 1;
    var copies = Math.max(2, Math.ceil((window.innerWidth * 2) / tickerCopyW) + 1);
    var html = '';
    for (var i = 0; i < copies; i++) html += '<span>' + run + '</span>';
    tickerEl.innerHTML = html;
    tickerX = window.innerWidth;   // start just off the right edge
  }
  function tickerFrame(ts) {
    if (tickerKey) {
      var dt = tickerLast ? Math.min(ts - tickerLast, 100) : 0;
      var speed = (CFG.tickerSpeed || 120) * (window.innerWidth / 1920);  // px per second, scaled to screen
      tickerX -= speed * dt / 1000;
      if (tickerX <= -tickerCopyW) tickerX += tickerCopyW;   // seamless loop
      tickerEl.style.transform = 'translateX(' + tickerX + 'px)';
    }
    tickerLast = ts;
    window.requestAnimationFrame(tickerFrame);
  }
  window.requestAnimationFrame(tickerFrame);

  function applyConfig(c) {
    if (!c) return;
    var oldRefresh = CFG.refreshMs;
    CFG = c;
    if (typeof c.marginPct === 'number') document.documentElement.style.setProperty('--m', c.marginPct + 'vh');  // v1.4.1
    layers.forEach(function (el) { el.style.transitionDuration = CFG.fadeMs + 'ms'; });
    if (refreshTimer && CFG.refreshMs !== oldRefresh) {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(refreshList, CFG.refreshMs);
    }
  }
  applyConfig(CFG);

  // v1.2.0 — Pull settings + slide list; on failure keep what we have
  function refreshList(done) {
    getJSON('api=list').then(function (j) {
      everLoaded = true;
      applyConfig(j.config);
      setTicker(j.ticker);                                             // v1.4.0
      var newList = j.slides || [];
      var changed = newList.length !== list.length ||
        newList.some(function (s, i) { return !list[i] || list[i].id !== s.id; });
      list = newList;
      if (changed) { order = []; pos = 0; }
      var keep = {};
      list.forEach(function (s) { keep[s.id] = true; });
      Object.keys(cache).forEach(function (id) { if (!keep[id]) delete cache[id]; });
      if (done) done();
    }).catch(function () {
      if (!everLoaded) showMsg('Connecting to slideshow…');
      if (done) done();
    });
  }

  // v1.2.0 — Play order: shuffled (Fisher-Yates) or filename order
  function buildOrder() {
    var o = list.slice();
    if (CFG.shuffle) {
      for (var i = o.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = o[i]; o[i] = o[j]; o[j] = t;
      }
      if (o.length > 1 && o[0].id === lastId) { var t2 = o[0]; o[0] = o[1]; o[1] = t2; }
    }
    return o;
  }

  // v1.2.0 — Image from cache, or download (re-download if file changed)
  function loadImage(item, cb) {
    var c = cache[item.id];
    if (c && c.updated === item.updated) { cb(c.src); return; }
    getJSON('api=image&id=' + encodeURIComponent(item.id)).then(function (j) {
      cache[item.id] = { updated: item.updated, src: j.data };
      cb(j.data);
    }).catch(function () { cb(c ? c.src : null); });
  }

  // v1.2.0 — Show next slide with crossfade, then schedule the one after
  // v1.4.3 — per-slide time: "_long" in the file name gets longSlideMs
  function slideTime(item) {
    if (item && /_long/i.test(item.name) && CFG.longSlideMs) return CFG.longSlideMs;
    return CFG.slideMs;
  }

  function showNext() {
    if (!list.length) {
      if (everLoaded) showMsg('No slides yet — add images to the slideshow folder in Google Drive.');
      layers.forEach(function (el) { el.classList.remove('show'); });
      currentSrc = null;
      setTimeout(showNext, 10000);
      return;
    }
    showMsg('');
    if (pos >= order.length) { order = buildOrder(); pos = 0; }
    var item = order[pos];
    pos++;

    loadImage(item, function (src) {
      if (!src) { setTimeout(showNext, 1000); return; }
      if (src === currentSrc) { setTimeout(showNext, slideTime(item)); return; }  // v1.4.3
      var back = 1 - front;
      var el = layers[back];
      el.onload = function () {
        el.onload = null;
        el.classList.add('show');
        layers[front].classList.remove('show');
        front = back;
        currentSrc = src;
        lastId = item.id;
        prefetch();
        setTimeout(showNext, slideTime(item));  // v1.4.3 — was CFG.slideMs
      };
      el.onerror = function () { el.onerror = null; setTimeout(showNext, 1000); };
      el.src = src;
    });
  }

  // v1.2.0 — Warm the cache for the upcoming slide
  function prefetch() {
    if (pos >= order.length) return;
    loadImage(order[pos], function () {});
  }

  // v1.2.0 — Click / OK button attempts full-screen (support varies by TV)
  document.addEventListener('click', function () {
    var d = document.documentElement;
    var fs = d.requestFullscreen || d.webkitRequestFullscreen;
    if (fs) { try { fs.call(d); } catch (e) {} }
  });

  // v1.2.0 — Start; retry every 30s until the feed answers the first time
  function start() {
    refreshList(function () {
      if (!everLoaded) { setTimeout(start, 30000); return; }
      if (!started) {
        started = true;
        refreshTimer = setInterval(refreshList, CFG.refreshMs);
        setTimeout(function () {
          if (navigator.onLine !== false) window.location.reload();
        }, CFG.reloadMs);
        showNext();
      }
    });
  }
  start();
</script>
